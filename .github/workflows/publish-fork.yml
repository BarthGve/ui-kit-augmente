# Publishes ui-components under the fork's npm scope (ADR 005).
# Pull request: dry-run (stage, install check, archive uploaded), no secret.
# Tag fork@<version> on a commit of main: the same checks, then npm publish.
name: Publish fork

on:
  push:
    tags:
      - "fork@*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install-front:
    uses: ./.github/workflows/front-dependencies-installation.yml
    with:
      node_version: "24.x"

  verify:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Restore the frontend cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: front-node_modules-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Test the fork scripts and this workflow
        run: |
          node --test scripts/fork-package.test.mjs
          node --test scripts/publish-fork-workflow.test.mjs
      - name: Build
        run: yarn build
      - name: Stage and check the fork package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${TAG#fork@}"
          else
            # Dry-run: any accepted version, nothing is published.
            version="$(node -p "require('./packages/ui-components/package.json').version")-fork.1"
          fi
          archive="$(node scripts/stage-fork-package.mjs "$version" --out "$RUNNER_TEMP/fork-package" | tail -n 1)"
          node scripts/check-fork-package.mjs "$archive" "$version"
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: fork-package
          path: ${{ runner.temp }}/fork-package/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fork@')
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the tag commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: fork-package
          path: ${{ runner.temp }}/fork-package
      # Trusted publishing (ADR 006): npm authenticates the job through OIDC,
      # no token or secret is involved. setup-node is kept free of its registry
      # option: it injects a placeholder auth token that npm would send
      # instead of the OIDC credential.
      # Diagnostic (remove once the trusted publisher works): print the OIDC
      # claims npm compares with the trusted publisher form. The token is
      # masked and never printed, only these non-secret claims are.
      # Node 24 ships npm 11.19: trusted publishing "allowed actions" and
      # dist-tags over OIDC need npm 11.21 or later (npm docs).
      - name: Use an npm that supports the trusted publisher actions
        run: npm install -g npm@11.21.0
      - name: Show the OIDC identity npm will see
        run: |
          npm --version
          TOKEN="$(curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).value')"
          echo "::add-mask::$TOKEN"
          export TOKEN
          node -e 'const c = JSON.parse(Buffer.from(process.env.TOKEN.split(".")[1], "base64url")); for (const k of ["iss", "aud", "repository", "repository_owner", "repository_id", "repository_owner_id", "job_workflow_ref", "workflow_ref", "ref", "ref_type", "environment", "runner_environment"]) console.log(k + "=" + c[k]);'
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/fork-package/*.tgz --provenance --access public --tag latest
