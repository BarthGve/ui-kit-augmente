# Publishes ui-components under the fork's npm scope (ADR 005).
# Pull request: dry-run (stage, install check, archive uploaded), no secret.
# Tag fork@<version> on a commit of main: the same checks, then npm publish.
name: Publish fork

on:
  push:
    tags:
      - "fork@*"
  pull_request:
    branches:
      - "*"

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  install-front:
    uses: ./.github/workflows/front-dependencies-installation.yml
    with:
      node_version: "24.x"

  verify:
    runs-on: ubuntu-latest
    needs: install-front
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
      - name: Restore the frontend cache
        uses: actions/cache@v5
        with:
          path: |
            node_modules
            packages/*/node_modules
          key: front-node_modules-${{ hashFiles('yarn.lock') }}
          fail-on-cache-miss: true
      - name: Lint
        run: yarn lint
      - name: Test
        run: yarn test
      - name: Test the fork scripts and this workflow
        run: |
          node --test scripts/fork-package.test.mjs
          node --test scripts/publish-fork-workflow.test.mjs
      - name: Build
        run: yarn build
      - name: Stage and check the fork package
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            version="${TAG#fork@}"
          else
            # Dry-run: any accepted version, nothing is published.
            version="$(node -p "require('./packages/ui-components/package.json').version")-fork.1"
          fi
          archive="$(node scripts/stage-fork-package.mjs "$version" --out "$RUNNER_TEMP/fork-package" | tail -n 1)"
          node scripts/check-fork-package.mjs "$archive" "$version"
      - name: Upload the archive
        uses: actions/upload-artifact@v4
        with:
          name: fork-package
          path: ${{ runner.temp }}/fork-package/*.tgz
          if-no-files-found: error

  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/fork@')
    runs-on: ubuntu-latest
    needs: verify
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Require the tag commit to be on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24.x"
          registry-url: https://registry.npmjs.org
      - name: Download the archive
        uses: actions/download-artifact@v4
        with:
          name: fork-package
          path: ${{ runner.temp }}/fork-package
      # Trusted publishing (ADR 006): npm authenticates the job through OIDC,
      # no token or secret is involved.
      - name: Publish
        run: npm publish "$RUNNER_TEMP"/fork-package/*.tgz --provenance --access public --tag latest
